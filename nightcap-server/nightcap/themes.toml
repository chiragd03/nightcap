# Home's themed rows that aren't the AI's (see home.py): each a TMDB list with a name that says what
# its titles share. Only facts TMDB keeps are used (genres, language, episode length, mini-series),
# so a name is always true of its titles. A profile is shown the ones that fit what it watches.
#
#   name     what Home calls it
#   kind     "movie" or "tv"
#   genres   the genres it's about, for how well it fits a profile (movie and TV genre ids alike)
#   lang     only for profiles with this language picked (and in it); otherwise in the profile's
#            languages and English
#   params   TMDB discover's own (sorted by popularity unless sort_by is given)

[[theme]]
id = "feelgood-comedy"
name = "Feel-good comedies"
kind = "movie"
genres = [35]
params = { with_genres = "35", without_genres = "27|53|80|18", "vote_average.gte" = 6.5, "vote_count.gte" = 300 }

